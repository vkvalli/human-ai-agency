<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agency Dashboard</title>
    <style>
      body { font-family: Inter, system-ui, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; width: 320px; }
      .wrap { padding: 14px; display: grid; gap: 10px; }
      .card { background: #1e293b; border-radius: 12px; padding: 12px; }
      .label { font-size: 12px; color: #94a3b8; margin: 0 0 6px; }
      .value { margin: 0; font-size: 24px; font-weight: 700; }
      .muted { font-size: 12px; color: #cbd5e1; margin: 0; line-height: 1.4; }
      .row { display: flex; justify-content: space-between; gap: 8px; }
      .pill { padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
      .high { background: #14532d; }
      .medium { background: #92400e; }
      .low { background: #7f1d1d; }
      button { background: #334155; border: 0; color: #e2e8f0; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <p class="label">Latest Agency Score</p>
        <div class="row">
          <p id="score" class="value">--</p>
          <span id="band" class="pill medium">unknown</span>
        </div>
      </div>

      <div class="card">
        <p class="label">Session</p>
        <p id="session" class="muted">No active session</p>
        <p id="status" class="muted">Status: unknown</p>
        <p id="host" class="muted">Site: --</p>
        <p id="pending" class="muted">Pending sync: 0</p>
      </div>

      <div class="row">
        <button id="refresh">Refresh</button>
        <button id="end">End Session</button>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
